<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bluebook Matching Game</title>
  <style>
    :root {
      --bluebook-blue: #0056a8;
      --bluebook-blue-light: #1976d2;
      --bluebook-dark: #001b3a;
      --emerald: #059669;
      --emerald-border: #10b981;
      --rose-border: #ef4444;
      --bg-gradient: radial-gradient(circle at top, var(--bluebook-blue-light) 0, var(--bluebook-blue) 45%, #001b3a 100%);
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      font-family: var(--font-sans);
      color: #0f172a;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 1120px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 24px;
      border: 1px solid rgba(0, 43, 90, 0.4);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .header-top {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 768px) {
      .card {
        padding: 32px;
      }
      .header-top {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #0b2c59;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 6px 0 0;
      color: rgba(11, 44, 89, 0.8);
      font-size: 15px;
      max-width: 720px;
      line-height: 1.5;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .pill {
      padding: 10px 12px;
      background: #e0ecff;
      border: 1px solid #c5daff;
      border-radius: 18px;
      font-size: 14px;
      color: #0b2c59;
      font-weight: 600;
    }

    .button {
      padding: 10px 16px;
      border-radius: 18px;
      border: 1px solid var(--bluebook-dark);
      background: var(--bluebook-blue);
      color: white;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .button:hover {
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
    }

    .button:active {
      transform: scale(0.98);
    }

    .levels-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .levels-label {
      font-size: 13px;
      font-weight: 700;
      color: #0b2c59;
      margin-right: 4px;
    }

    .level-btn {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #bfdbfe;
      background: white;
      color: #0b2c59;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .level-btn:hover {
      background: #eef6ff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .level-btn.active {
      background: #0b2c59;
      color: white;
      border-color: #0b2c59;
    }

    .level-description {
      margin: 0;
      font-size: 13px;
      color: rgba(11, 44, 89, 0.8);
    }

    .banner {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      background: #ecfdf3;
      border: 1px solid #bbf7d0;
      color: #065f46;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 768px) {
      .banner {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .banner.show {
      display: flex;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    @media (min-width: 768px) {
      .grid {
        gap: 14px;
      }
    }

    .tile {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      border: 1px solid var(--bluebook-dark);
      background: var(--bluebook-blue);
      color: white;
      font-weight: 700;
      font-size: 12px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.35s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      transform-style: preserve-3d;
    }

    .tile:hover:not(.matched):not(.disabled) {
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
    }

    .tile span {
      display: inline-block;
      transform: rotateY(180deg);
    }

    .tile.face-up {
      background: white;
      color: var(--bluebook-blue);
      border-color: var(--bluebook-blue);
      transform: rotateY(0deg);
    }

    .tile.face-up span {
      transform: none;
    }

    .tile.disabled {
      cursor: default;
    }

    .pulse-success {
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.75);
      border-color: var(--emerald-border);
    }

    .pulse-fail {
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.85);
      border-color: var(--rose-border);
    }

    .next-button {
      background: var(--emerald);
      border: 1px solid #047857;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="header-top">
        <div>
          <h1>Bluebook Matching Game</h1>
          <p class="subtitle">
            Flip two cards to match each Bluebook rule number with its topic. Use the levels below to move from smaller boards
            to more advanced rules. Every rule appears in at least one level.
          </p>
        </div>
        <div class="stats">
          <div class="pill">Moves: <span id="moves">0</span></div>
          <div class="pill">Matches: <span id="matches">0</span> / <span id="total-pairs">0</span></div>
          <button class="button" id="reset-btn">Reset Level</button>
        </div>
      </div>
      <div class="levels-row">
        <span class="levels-label">Levels:</span>
        <div id="levels-container" class="levels-row"></div>
      </div>
      <p class="level-description" id="level-description"></p>
    </header>

    <div id="completion-banner" class="banner">
      <span>Nicely done! You've matched all of the pairs on this level.</span>
      <button class="button next-button" id="next-btn">Go to Next Level</button>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <script>
    const BLUEBOOK_BLUE = '#0056A8';
    const BLUEBOOK_BLUE_LIGHT = '#1976D2';

    const RULE_PAIRS = [
      { key: 'r1', rule: 'Rule 1', topic: 'Structure & Use of Citations' },
      { key: 'r2', rule: 'Rule 2', topic: 'Typefaces for Law Reviews' },
      { key: 'r3', rule: 'Rule 3', topic: 'Subdivisions' },
      { key: 'r4', rule: 'Rule 4', topic: 'Short Citation Forms' },
      { key: 'r5', rule: 'Rule 5', topic: 'Quotations' },
      { key: 'r6', rule: 'Rule 6', topic: 'Abbreviations, Numerals & Symbols' },
      { key: 'r7', rule: 'Rule 7', topic: 'Italicization for Style' },
      { key: 'r8', rule: 'Rule 8', topic: 'Capitalization' },
      { key: 'r9', rule: 'Rule 9', topic: 'Titles of Judges & Courts' },
      { key: 'r10', rule: 'Rule 10', topic: 'Cases' },
      { key: 'r11', rule: 'Rule 11', topic: 'Constitutions' },
      { key: 'r12', rule: 'Rule 12', topic: 'Statutes' },
      { key: 'r13', rule: 'Rule 13', topic: 'Legislative Materials' },
      { key: 'r14', rule: 'Rule 14', topic: 'Administrative & Executive Materials' },
      { key: 'r15', rule: 'Rule 15', topic: 'Books & Other Nonperiodic Materials' },
      { key: 'r16', rule: 'Rule 16', topic: 'Periodical Materials' },
      { key: 'r17', rule: 'Rule 17', topic: 'Unpublished & Forthcoming Sources' },
      { key: 'r18', rule: 'Rule 18', topic: 'Internet & Electronic Media' },
      { key: 'r19', rule: 'Rule 19', topic: 'Services' },
      { key: 'r20', rule: 'Rule 20', topic: 'Foreign Materials' },
      { key: 'r21', rule: 'Rule 21', topic: 'International Materials' },
      { key: 'r22', rule: 'Rule 22', topic: 'Tribal Nations' },
      { key: 'r23', rule: 'Rule 23', topic: 'Archival Sources' },
    ];

    const LEVELS = [
      {
        id: 1,
        name: 'Level 1: Foundations',
        description: 'Start with core citation structures (Rules 1–5).',
        ruleKeys: ['r1', 'r2', 'r3', 'r4', 'r5'],
        rows: 2,
        cols: 5,
      },
      {
        id: 2,
        name: 'Level 2: Style & Formatting',
        description: 'Work with typography and basic style rules (Rules 6–10).',
        ruleKeys: ['r6', 'r7', 'r8', 'r9', 'r10'],
        rows: 2,
        cols: 5,
      },
      {
        id: 3,
        name: 'Level 3: Core Sources',
        description: 'Match constitutions, statutes, and key materials (Rules 11–15).',
        ruleKeys: ['r11', 'r12', 'r13', 'r14', 'r15'],
        rows: 2,
        cols: 5,
      },
      {
        id: 4,
        name: 'Level 4: Advanced Sources',
        description: 'Electronic media and services (Rules 16–19).',
        ruleKeys: ['r16', 'r17', 'r18', 'r19'],
        rows: 2,
        cols: 4,
      },
      {
        id: 5,
        name: 'Level 5: Foreign & International',
        description: 'Foreign, International, Tribal Nations, and Archival Sources (Rules 20–23).',
        ruleKeys: ['r20', 'r21', 'r22', 'r23'],
        rows: 2,
        cols: 4,
      },
    ];

    const state = {
      currentLevelIndex: 0,
      tiles: [],
      flippedIds: [],
      isChecking: false,
      moves: 0,
      matchesFound: 0,
      pulseIds: [],
      pulseType: null,
      timeouts: [],
    };

    const movesEl = document.getElementById('moves');
    const matchesEl = document.getElementById('matches');
    const totalPairsEl = document.getElementById('total-pairs');
    const resetBtn = document.getElementById('reset-btn');
    const levelsContainer = document.getElementById('levels-container');
    const levelDescription = document.getElementById('level-description');
    const banner = document.getElementById('completion-banner');
    const nextBtn = document.getElementById('next-btn');
    const gridEl = document.getElementById('grid');

    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function createTilesForLevel(level) {
      let idCounter = 1;
      const tiles = level.ruleKeys.flatMap((ruleKey) => {
        const rule = RULE_PAIRS.find((r) => r.key === ruleKey);
        if (!rule) return [];

        const numberTile = {
          id: idCounter++,
          key: rule.key,
          label: rule.rule,
          isFlipped: false,
          isMatched: false,
        };

        const topicTile = {
          id: idCounter++,
          key: rule.key,
          label: rule.topic,
          isFlipped: false,
          isMatched: false,
        };

        return [numberTile, topicTile];
      });

      const expectedCount = level.rows * level.cols;
      if (tiles.length !== expectedCount) {
        console.warn(`Level ${level.id} expected ${expectedCount} tiles, but created ${tiles.length}.`);
      }

      return shuffleArray(tiles);
    }

    function clearTimeouts() {
      state.timeouts.forEach((id) => clearTimeout(id));
      state.timeouts = [];
    }

    function setState(partial) {
      Object.assign(state, partial);
      render();
    }

    function loadLevel(index) {
      const safeIndex = Math.min(Math.max(index, 0), LEVELS.length - 1);
      const level = LEVELS[safeIndex];
      clearTimeouts();
      setState({
        currentLevelIndex: safeIndex,
        tiles: createTilesForLevel(level),
        flippedIds: [],
        isChecking: false,
        moves: 0,
        matchesFound: 0,
        pulseIds: [],
        pulseType: null,
      });
    }

    function resetGame() {
      loadLevel(state.currentLevelIndex);
    }

    function triggerMatchConfetti() {
      return;
    }

    function handleTileClick(index) {
      const tile = state.tiles[index];
      if (state.isChecking || tile.isMatched || tile.isFlipped) return;

      const newTiles = state.tiles.map((t, i) => (i === index ? { ...t, isFlipped: true } : t));
      const newFlippedIds = [...state.flippedIds, tile.id];

      setState({ tiles: newTiles, flippedIds: newFlippedIds });

      if (newFlippedIds.length === 2) {
        state.isChecking = true;
        state.moves += 1;
        render();

        const peekTimeout = setTimeout(() => {
          const [firstId, secondId] = newFlippedIds;
          const firstTileIndex = state.tiles.findIndex((t) => t.id === firstId);
          const secondTileIndex = state.tiles.findIndex((t) => t.id === secondId);
          if (firstTileIndex === -1 || secondTileIndex === -1) {
            setState({ isChecking: false, flippedIds: [] });
            return;
          }

          const firstTile = state.tiles[firstTileIndex];
          const secondTile = state.tiles[secondTileIndex];

          if (firstTile.key === secondTile.key) {
            triggerMatchConfetti();
            setState({ pulseIds: [firstId, secondId], pulseType: 'success' });

            const updatedTiles = [...state.tiles];
            updatedTiles[firstTileIndex] = { ...firstTile, isMatched: true };
            updatedTiles[secondTileIndex] = { ...secondTile, isMatched: true };

            state.matchesFound += 1;
            state.tiles = updatedTiles;
            state.flippedIds = [];
            state.isChecking = false;
            render();

            const clearPulse = setTimeout(() => {
              setState({ pulseIds: [], pulseType: null });
            }, 220);
            state.timeouts.push(clearPulse);
          } else {
            setState({ pulseIds: [firstId, secondId], pulseType: 'fail' });

            const endPulse = setTimeout(() => {
              setState({ pulseIds: [], pulseType: null });

              const flipBack = setTimeout(() => {
                const resetTiles = state.tiles.map((t) =>
                  t.id === firstId || t.id === secondId ? { ...t, isFlipped: false } : t,
                );
                state.tiles = resetTiles;
                state.flippedIds = [];
                state.isChecking = false;
                render();
              }, 1200);
              state.timeouts.push(flipBack);
            }, 220);
            state.timeouts.push(endPulse);
          }
        }, 200);

        state.timeouts.push(peekTimeout);
      }
    }

    function renderLevels() {
      levelsContainer.innerHTML = '';
      LEVELS.forEach((level, idx) => {
        const btn = document.createElement('button');
        btn.textContent = level.name;
        btn.className = 'level-btn' + (idx === state.currentLevelIndex ? ' active' : '');
        btn.addEventListener('click', () => loadLevel(idx));
        levelsContainer.appendChild(btn);
      });
    }

    function renderHeader() {
      const currentLevel = LEVELS[state.currentLevelIndex];
      movesEl.textContent = state.moves;
      matchesEl.textContent = state.matchesFound;
      totalPairsEl.textContent = currentLevel.ruleKeys.length;
      levelDescription.textContent = currentLevel.description;

      if (state.matchesFound === currentLevel.ruleKeys.length) {
        banner.classList.add('show');
        if (state.currentLevelIndex < LEVELS.length - 1) {
          nextBtn.style.display = 'inline-flex';
        } else {
          nextBtn.style.display = 'none';
        }
      } else {
        banner.classList.remove('show');
      }
    }

    function renderGrid() {
      const currentLevel = LEVELS[state.currentLevelIndex];
      gridEl.style.gridTemplateColumns = `repeat(${currentLevel.cols}, minmax(0, 1fr))`;
      gridEl.innerHTML = '';

      state.tiles.forEach((tile, index) => {
        const btn = document.createElement('button');
        btn.className = 'tile';
        if (tile.isFlipped || tile.isMatched) btn.classList.add('face-up');
        if (tile.isMatched) btn.classList.add('disabled');
        if (state.pulseIds.includes(tile.id)) {
          btn.classList.add(state.pulseType === 'success' ? 'pulse-success' : 'pulse-fail');
        }
        btn.disabled = state.isChecking || tile.isMatched;
        btn.style.backgroundColor = tile.isFlipped || tile.isMatched ? 'white' : BLUEBOOK_BLUE;
        btn.style.color = tile.isFlipped || tile.isMatched ? BLUEBOOK_BLUE : 'white';
        btn.style.borderColor = tile.isFlipped || tile.isMatched ? BLUEBOOK_BLUE : '#001b3a';

        const inner = document.createElement('div');
        inner.style.width = '100%';
        inner.style.height = '100%';
        inner.style.display = 'flex';
        inner.style.alignItems = 'center';
        inner.style.justifyContent = 'center';
        inner.style.padding = '4px 8px';
        inner.style.textAlign = 'center';
        inner.style.lineHeight = '1.2';

        const text = document.createElement('span');
        text.textContent = tile.isFlipped || tile.isMatched ? tile.label : 'Bluebook?';
        inner.appendChild(text);
        btn.appendChild(inner);

        btn.addEventListener('click', () => handleTileClick(index));
        gridEl.appendChild(btn);
      });
    }

    function render() {
      renderLevels();
      renderHeader();
      renderGrid();
    }

    resetBtn.addEventListener('click', resetGame);
    nextBtn.addEventListener('click', () => loadLevel(state.currentLevelIndex + 1));

    loadLevel(0);
  </script>
</body>
</html>
